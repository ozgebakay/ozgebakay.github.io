<dl id="" class="wp-caption align{{include.align}}" style="max-width: {{include.width}}px; max-height: none !important;">

<dt>
  <a href="{{ site.baseurl }}{{ include.href }}">
    <img class="" 
         src="{{ site.baseurl }}{{ include.url }}" 
         alt="{{ include.caption }}" 
         style="width: 100% !important; height: auto !important; max-height: none !important; object-fit: contain !important;" />
  </a>
</dt>

<dd>{{ include.caption }}</dd>
</dl>
